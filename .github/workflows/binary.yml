name: Build Linux binaries

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build binary package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags='-s -w' -o dist/package/mosctl ./cmd/mosctl
          cp templates/config.yaml dist/package/config.yaml
          cp -r rules dist/package/rules
          cp README.md dist/package/README.md
          tar -czf dist/mosctl-linux-${GOARCH}.tar.gz -C dist/package .
          cd dist
          sha256sum mosctl-linux-${GOARCH}.tar.gz > checksums-${GOARCH}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mosctl-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/checksums-*.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mosctl-linux-*
          merge-multiple: true
          path: dist
      - name: Publish release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/checksums-*.txt --clobber
